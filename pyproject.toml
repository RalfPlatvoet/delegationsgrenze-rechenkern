[project]
name = "delegationsgrenze"
version = "0.1.0"
description = "Rechenkern zum Working Paper Die Delegationsgrenze"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
# Die Spezifikation sieht hypothesis fuer die Invariantenpruefung vor. Solange es
# fehlt, zieht `tests/test_invariants.py` aus einem festgelegten Zufallsstrom.
test = ["pytest>=8", "hypothesis>=6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
